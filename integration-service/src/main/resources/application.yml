server:
  port: 8081

spring:
  application:
    name: integration-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/orders
    username: orders
    password: orders
    hikari:
      maximum-pool-size: 5
      # Fail fast when Postgres is down so Camel's redelivery policy, not Hikari, controls the timing.
      connection-timeout: 3000

app:
  security:
    # Browser-facing issuer (what Keycloak writes into "iss"), and the in-network JWKS endpoint.
    issuer: ${OIDC_ISSUER:http://localhost:8180/realms/orders-poc}
    jwk-set-uri: ${OIDC_JWKS_URI:http://localhost:8180/realms/orders-poc/protocol/openid-connect/certs}
    audience: orders-api

camel:
  springboot:
    name: integration-service
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP:localhost:9094}

orders:
  topic:
    raw: orders.raw
    processed: orders.processed
    dlt: orders.raw.DLT
fx:
  topic:
    rates: fx.rates

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

logging:
  level:
    org.apache.kafka: WARN
